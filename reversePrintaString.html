<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>printing a string reverse order</title>
</head>
<body>
    <script>
      let str=prompt("Enter a String");
      let n=str.length;
     // document.write(n+"<br>");
      for( i=n-1;i>=0;i--)
      document.write(str[i]+" ");
    </script>
</body>
</html>
