<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>butterfly pattern</title>
</head>
<body>
    <script>
        let n=5;
    for(i=1;i<=n;i++){
    for(j=1;j<=i;j++) document.write("* ");
    
for(k=1;k<=(3*n)-(3*i);k++) document.write("&nbsp&nbsp");

  for(j=1;j<=i;j++) document.write("* ");
 
  document.write("<br>");
    }
    for(i=n-1;i>=1;i--){
    for(j=1;j<=i;j++) document.write("* ");
    
for(k=1;k<=(6*n)-(6*i);k++) document.write("&nbsp");

  for(j=1;j<=i;j++) document.write("* ");
 
  document.write("<br>");
    }

</script>
</body>
</html>
